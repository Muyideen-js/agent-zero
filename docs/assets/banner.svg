<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Agent Zero: give AI a company, not your wallet">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00e29a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e29a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#07080a" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#07080a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#07080a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'SFMono-Regular',Consolas,Menlo,monospace}
      .spin{animation:spin 40s linear infinite;transform-origin:1000px 210px}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pay{animation:pay 3.2s cubic-bezier(.65,0,.35,1) infinite}
      .pay2{animation:pay 3.2s cubic-bezier(.65,0,.35,1) 1.1s infinite}
      .bad{animation:bad 3.2s cubic-bezier(.65,0,.35,1) 2.1s infinite}
      @keyframes pay{0%{opacity:0;offset-distance:0%}10%{opacity:1}85%{opacity:1}100%{opacity:0;offset-distance:100%}}
      @keyframes bad{0%{opacity:0;offset-distance:0%}15%{opacity:1}50%{offset-distance:70%}85%{opacity:1}100%{opacity:0;offset-distance:0%}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.45}}
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="#07080a"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- orbit -->
  <g class="spin">
    <circle cx="1000" cy="210" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="2 8"/>
  </g>
  <circle cx="1000" cy="210" r="196" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  <g stroke="#ffffff" stroke-opacity="0.09">
    <line x1="1000" y1="210" x2="1000" y2="60"/>
    <line x1="1000" y1="210" x2="1143" y2="164"/>
    <line x1="1000" y1="210" x2="1088" y2="331"/>
    <line x1="1000" y1="210" x2="912" y2="331"/>
    <line x1="1000" y1="210" x2="857" y2="164"/>
  </g>

  <!-- particles -->
  <circle r="5" fill="#00e29a" class="pay" style="offset-path:path('M1000 210 L1143 164')"/>
  <circle r="5" fill="#00e29a" class="pay2" style="offset-path:path('M1000 210 L1088 331')"/>
  <circle r="5" fill="#ff5c5c" class="bad" style="offset-path:path('M912 331 L1000 210')"/>

  <!-- agents -->
  <g fill="#121317" stroke="#ffffff" stroke-opacity="0.14">
    <rect x="980" y="40" width="40" height="40" rx="11"/>
    <rect x="1123" y="144" width="40" height="40" rx="11"/>
    <rect x="1068" y="311" width="40" height="40" rx="11"/>
    <rect x="892" y="311" width="40" height="40" rx="11"/>
    <rect x="837" y="144" width="40" height="40" rx="11"/>
  </g>
  <g class="m" font-size="11" fill="#8b8f98" text-anchor="middle">
    <text x="1000" y="99">Atlas · CEO</text>
    <text x="1143" y="203">Research</text>
    <text x="1088" y="370">Product</text>
    <text x="912" y="370">Sales</text>
    <text x="857" y="203">Finance</text>
  </g>
  <g fill="#ededef" font-size="16" text-anchor="middle" class="t" font-weight="700">
    <text x="1000" y="66">◆</text><text x="1143" y="170">⌕</text><text x="1088" y="337">▣</text><text x="912" y="337">↗</text><text x="857" y="170">▥</text>
  </g>

  <!-- treasury core -->
  <rect x="945" y="155" width="110" height="110" rx="28" fill="#0c0d10" stroke="#00e29a" stroke-opacity="0.4"/>
  <rect x="937" y="147" width="126" height="126" rx="34" fill="none" stroke="#00e29a" stroke-opacity="0.12" class="pulse"/>
  <path d="M1000 180 l14 6 v10 c0 9-6 15-14 18 c-8-3-14-9-14-18 v-10z" fill="none" stroke="#00e29a" stroke-width="2"/>
  <text x="1000" y="235" text-anchor="middle" class="m" font-size="11" fill="#ededef">policy-enforced</text>
  <text x="1000" y="252" text-anchor="middle" class="m" font-size="10" fill="#5b5f69" letter-spacing="2">TREASURY</text>

  <rect width="760" height="420" fill="url(#fade)"/>

  <!-- wordmark -->
  <g transform="translate(72 82)">
    <rect width="44" height="44" rx="12" fill="#ededef"/>
    <circle cx="22" cy="22" r="10" fill="none" stroke="#07080a" stroke-width="3.8"/>
    <path d="M14.6 29.4 28 16" stroke="#07080a" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="29.7" cy="14.3" r="3.6" fill="#00e29a" stroke="#ededef" stroke-width="1.6"/>
    <text x="60" y="31" class="t" font-size="24" font-weight="700" fill="#ededef">Agent Zero</text>
  </g>
  <text x="72" y="208" class="t" font-size="54" font-weight="800" fill="#ededef" letter-spacing="-1.5">Give AI a <tspan fill="#00e29a">company.</tspan></text>
  <text x="72" y="268" class="t" font-size="54" font-weight="800" fill="#5b5f69" letter-spacing="-1.5">Not your wallet.</text>
  <text x="72" y="318" class="t" font-size="18" fill="#8b8f98">An AI workforce runs the business. A NEAR smart contract enforces the money.</text>
  <g transform="translate(72 348)" class="m" font-size="12">
    <rect width="142" height="28" rx="14" fill="#00e29a" fill-opacity="0.12" stroke="#00e29a" stroke-opacity="0.3"/>
    <text x="71" y="18.5" text-anchor="middle" fill="#00e29a">● LIVE ON TESTNET</text>
    <rect x="152" width="190" height="28" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="247" y="18.5" text-anchor="middle" fill="#8b8f98">NEAR Hackathon 2026</text>
  </g>
</svg>
